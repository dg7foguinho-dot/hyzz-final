name: HyzzFFZ
options:
  bundleIdPrefix: com.hyzz
  deploymentTarget:
    iOS: 14.0
targets:
  HyzzFFZ:
    type: application
    platform: iOS
    sources: [HyzzFFZ]
    settings:
      base:
        INFOPLIST_FILE: HyzzFFZ/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hyzz.ffz
    dependencies:
      - target: HyzzFFZExtension
  HyzzFFZExtension:
    type: app-extension
    platform: iOS
    sources: [HyzzFFZExtension]
    settings:
      base:
        INFOPLIST_FILE: HyzzFFZExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hyzz.ffz.extension
